name: Build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Validate engine
        run: |
          bash -n Support/Engine/convert_videos.sh
          bash Tests/test_metadata_normalization.sh
      - name: Validate packaging scripts
        run: bash -n Scripts/*.sh
      - name: Render and validate Cask fixture
        run: |
          ./Scripts/render-cask.sh 0.0.0 aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa "$RUNNER_TEMP/m-series-video-converter.rb"
          ruby -c "$RUNNER_TEMP/m-series-video-converter.rb"
      - name: Build and verify app bundle
        run: |
          APP_VERSION=0.0.0 ./Scripts/build-app.sh
          test -f "dist/M-Series Video Converter.app/Contents/Resources/AppIcon.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' 'dist/M-Series Video Converter.app/Contents/Info.plist')" = "AppIcon.icns"
